[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pengolahan-citra-id"
version = "0.1.0"
description = "Materi praktikum pengolahan citra dan machine learning berbahasa Indonesia"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Tim Pengajar (silakan sunting)"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "scikit-image>=0.24,<0.27",
  "scikit-learn>=1.5,<2",
  "pandas>=2,<4",
]

[project.optional-dependencies]
belajar = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "nbformat>=5.9,<6"]
test = ["pytest>=8,<10", "nbformat>=5.9,<6", "nbclient>=0.10,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
